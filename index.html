<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Scroll through a book one screen at a time." />
    <title>Kitaabi Keeda</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
    />
  </head>
  <body>
    <header class="chrome" aria-hidden="true">
      <div class="progress"><div class="progress-fill"></div></div>
      <p class="chapter-label"></p>
    </header>

    <main class="feed" tabindex="-1" aria-live="off">
      <p class="status">Opening the book…</p>
    </main>

    <form class="jump" hidden novalidate>
      <label for="jump-input">Go to page</label>
      <input id="jump-input" type="number" inputmode="numeric" min="1" enterkeyhint="go" autocomplete="off" />
      <span class="jump-total"></span>
      <button type="submit">Go</button>
    </form>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
